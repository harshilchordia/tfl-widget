name: Build APK on Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from release tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"; VERSION="${VERSION#V}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            echo "Release tag must look like v1.2 or v1.2.3 (got '$TAG')" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[4]:-0}"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          RDM_API_KEY: ${{ secrets.RDM_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare release files
        run: |
          APK="tfl-widget-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          shasum -a 256 "$APK" > "$APK.sha256"

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            tfl-widget-*.apk tfl-widget-*.apk.sha256 --clobber
